name: Semantic release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions: {}

# Pending runs can be replaced; the main Git history is the durable backlog.
concurrency:
  group: semantic-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up selected Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: ${{ hashFiles('.node-version') == '' && '24' || '' }}
          node-version-file: ${{ hashFiles('.node-version') && '.node-version' || '' }}
          cache: npm
      - name: Report installed runtimes
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          from scripts.workflow_diagnostics import write_record

          def report(tool, version):
              record = {"component": "workflow-runtime", "stage": "runtime", "event": "unavailable", "tool": tool}
              if isinstance(version, str) and re.fullmatch(r"v?[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}", version):
                  record.update(event="observed", version=version)
              write_record("Workflow diagnostic: ", record)

          for tool in ("node", "npm"):
              version = None
              try:
                  result = subprocess.run([tool, "--version"], capture_output=True, text=True, timeout=10)
                  if result.returncode == 0 and len(result.stdout) <= 32:
                      version = result.stdout.strip()
              except (OSError, subprocess.TimeoutExpired):
                  pass
              report(tool, version)
          report("python", ".".join(str(n) for n in sys.version_info[:3]))
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: Run offline regression tests
        run: npm test
      - name: Validate extension packages
        run: npm run lint
      - name: Validate the original PR version and squash classification
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --no-tags --no-prune --no-prune-tags --no-write-fetch-head --no-recurse-submodules --refmap= -- origin +refs/heads/main:refs/remotes/origin/main
          python3 -B scripts/release_plan.py check --base refs/remotes/origin/main --head "$GITHUB_SHA" --pr-title "$PR_TITLE"
      - name: Validate the durable main release backlog without publication
        if: github.event_name != 'pull_request'
        run: python3 -B scripts/release_plan.py pending --head "$GITHUB_SHA"

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      tags: ${{ steps.result.outputs.tags }}
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up selected Node runtime
        uses: actions/setup-node@v7
        with:
          node-version: ${{ hashFiles('.node-version') == '' && '24' || '' }}
          node-version-file: ${{ hashFiles('.node-version') && '.node-version' || '' }}
      - name: Report installed runtimes
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          from scripts.workflow_diagnostics import write_record

          def report(tool, version):
              record = {"component": "workflow-runtime", "stage": "runtime", "event": "unavailable", "tool": tool}
              if isinstance(version, str) and re.fullmatch(r"v?[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}", version):
                  record.update(event="observed", version=version)
              write_record("Workflow diagnostic: ", record)

          for tool in ("node", "npm"):
              version = None
              try:
                  result = subprocess.run([tool, "--version"], capture_output=True, text=True, timeout=10)
                  if result.returncode == 0 and len(result.stdout) <= 32:
                      version = result.stdout.strip()
              except (OSError, subprocess.TimeoutExpired):
                  pass
              report(tool, version)
          report("python", ".".join(str(n) for n in sys.version_info[:3]))
          PY
      - name: Reconcile immutable tags, draft assets and published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release_publish.py --head "$GITHUB_SHA" --output "$RUNNER_TEMP/new-releases.json"
      - name: Preserve confirmed publications even after a later failure
        id: result
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          file = pathlib.Path(os.environ["RUNNER_TEMP"]) / "new-releases.json"
          tags = json.loads(file.read_text()) if file.is_file() else []
          if not isinstance(tags, list) or not all(isinstance(t, str) and re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", t) for t in tags):
              raise SystemExit("Invalid publication result.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("tags=" + json.dumps(tags) + "\n")
          PY

  dispatch-stores:
    needs: publish
    if: always() && github.ref == 'refs/heads/main' && github.ref_type == 'branch' && needs.publish.outputs.tags != '' && needs.publish.outputs.tags != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.publish.outputs.tags) }}
    steps:
      - name: Dispatch the credential-free main coordinator once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          def write_line(line):
              try:
                  try:
                      fileno = getattr(sys.stderr, "fileno", None)
                      fd = fileno() if fileno is not None else None
                  except (OSError, ValueError):
                      fd = None
                  if type(fd) is int and fd >= 0:
                      # Bypass buffering: a failed flush can otherwise cause exit 120.
                      remaining = line.encode("ascii")
                      while remaining:
                          written = os.write(fd, remaining)
                          if written <= 0:
                              raise OSError("Diagnostic write made no progress")
                          remaining = remaining[written:]
                  else:
                      sys.stderr.write(line)
              except (OSError, ValueError):
                  pass

          def fail(message):
              write_line(message + "\n")
              raise SystemExit(1)

          def emit(stage, event, **fields):
              # Static call-site phases; project dynamic fields instead of logging raw data.
              record = {"component": 'release-dispatch', "stage": stage, "event": event}
              browser = fields.get("browser")
              if browser in ("firefox", "chrome"):
                  record["browser"] = browser
              tag = fields.get("tag")
              if isinstance(tag, str) and len(tag) <= 64 and re.fullmatch(r"v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
                  record["tag"] = tag
              code = fields.get("exit_code")
              if type(code) is int and -(2**31) <= code < 2**31:
                  record["exit_code"] = code
              version = fields.get("python_version")
              if isinstance(version, str) and re.fullmatch(r"[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}", version):
                  record["python_version"] = version
              line = "Workflow diagnostic: " + json.dumps(record, sort_keys=True) + "\n"
              write_line(line)

          emit("runtime", "observed", python_version=".".join(str(n) for n in sys.version_info[:3]))
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              emit("tag-validation", "rejected")
              fail("Invalid release tag.")
          emit("tag-validation", "accepted", tag=tag)
          emit("dispatch", "started", tag=tag)
          try:
              result = subprocess.run(["gh", "api", "--method", "POST", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/publish-stores.yml/dispatches", "--input", "-"], input=json.dumps({"ref": "main", "inputs": {"release-tag": tag}}), text=True, capture_output=True, timeout=60)
              if type(result.returncode) is int and result.returncode < 0:
                  emit("dispatch", "uncertain", tag=tag, exit_code=result.returncode)
                  fail("Coordinator dispatch outcome is uncertain; inspect existing runs before retrying.")
              if result.returncode:
                  emit("dispatch", "failed", tag=tag, exit_code=result.returncode)
                  fail("Coordinator dispatch failed; inspect existing runs before retrying.")
          except subprocess.TimeoutExpired:
              emit("dispatch", "uncertain", tag=tag)
              fail("Coordinator dispatch outcome is uncertain; inspect existing runs before retrying.")
          except OSError:
              emit("dispatch", "process-start-failed", tag=tag)
              fail("Coordinator dispatch outcome is uncertain; inspect existing runs before retrying.")
          emit("dispatch", "succeeded", tag=tag, exit_code=result.returncode)
          print("Store coordinator dispatched; this does not establish store submission or public availability.")
          PY
