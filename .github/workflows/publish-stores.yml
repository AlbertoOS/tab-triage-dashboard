name: Dispatch store publication
run-name: Store publication ${{ inputs.release-tag || github.event.release.tag_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Published stable GitHub release tag
        required: true
        type: string

permissions: {}

jobs:
  dispatch:
    # Release events run at tags: this job has no environment or store credentials.
    if: (github.event_name == 'release' && github.event.action == 'published' && github.event.release.draft == false && github.event.release.prerelease == false) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch trusted main workflows
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          def write_line(line):
              try:
                  try:
                      fileno = getattr(sys.stderr, "fileno", None)
                      fd = fileno() if fileno is not None else None
                  except (OSError, ValueError):
                      fd = None
                  if type(fd) is int and fd >= 0:
                      # Bypass buffering: a failed flush can otherwise cause exit 120.
                      remaining = line.encode("ascii")
                      while remaining:
                          written = os.write(fd, remaining)
                          if written <= 0:
                              raise OSError("Diagnostic write made no progress")
                          remaining = remaining[written:]
                  else:
                      sys.stderr.write(line)
              except (OSError, ValueError):
                  pass

          def fail(message):
              write_line(message + "\n")
              raise SystemExit(1)

          def emit(stage, event, **fields):
              # Static call-site phases; project dynamic fields instead of logging raw data.
              record = {"component": 'store-dispatch', "stage": stage, "event": event}
              browser = fields.get("browser")
              if browser in ("firefox", "chrome"):
                  record["browser"] = browser
              tag = fields.get("tag")
              if isinstance(tag, str) and len(tag) <= 64 and re.fullmatch(r"v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
                  record["tag"] = tag
              code = fields.get("exit_code")
              if type(code) is int and -(2**31) <= code < 2**31:
                  record["exit_code"] = code
              version = fields.get("python_version")
              if isinstance(version, str) and re.fullmatch(r"[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}", version):
                  record["python_version"] = version
              line = "Workflow diagnostic: " + json.dumps(record, sort_keys=True) + "\n"
              write_line(line)

          emit("runtime", "observed", python_version=".".join(str(n) for n in sys.version_info[:3]))
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              emit("tag-validation", "rejected")
              fail("Release tag must be stable semver.")
          emit("tag-validation", "accepted", tag=tag)
          repo = os.environ["GITHUB_REPOSITORY"]
          failures = []
          for browser in ("firefox", "chrome"):
              payload = json.dumps({"ref": "main", "inputs": {"release-tag": tag, "operation": "publish"}})
              emit("dispatch", "started", browser=browser, tag=tag)
              try:
                  result = subprocess.run(["gh", "api", "--method", "POST", f"repos/{repo}/actions/workflows/publish-{browser}.yml/dispatches", "--input", "-"], input=payload, text=True, capture_output=True, timeout=60)
              except subprocess.TimeoutExpired:
                  emit("dispatch", "uncertain", browser=browser, tag=tag)
                  failures.append(browser)
              except OSError:
                  emit("dispatch", "process-start-failed", browser=browser, tag=tag)
                  failures.append(browser)
              else:
                  if type(result.returncode) is int and result.returncode < 0:
                      emit("dispatch", "uncertain", browser=browser, tag=tag, exit_code=result.returncode)
                      failures.append(browser)
                  elif result.returncode:
                      emit("dispatch", "failed", browser=browser, tag=tag, exit_code=result.returncode)
                      failures.append(browser)
                  else:
                      emit("dispatch", "succeeded", browser=browser, tag=tag, exit_code=result.returncode)
          if failures:
              fail("Main store workflow dispatch not confirmed for " + ", ".join(failures) + "; inspect runs before retrying the affected workflow manually from main.")
          print("Main publication workflows dispatched; inspect their runs for publication results.")
          PY
