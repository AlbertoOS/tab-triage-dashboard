name: Publish firefox store

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Published stable GitHub release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      operation:
        description: Publish automatically, or verify release without store authentication
        required: true
        default: publish
        type: choice
        options: [publish, verify-release-only]

permissions: {}

concurrency:
  group: store-firefox-${{ inputs.operation }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Report installed runtimes
        run: |
          python3 - <<'PY'
          import re, sys
          from scripts.workflow_diagnostics import write_record

          def report(tool, version):
              record = {"component": "workflow-runtime", "stage": "runtime", "event": "unavailable", "tool": tool}
              if isinstance(version, str) and re.fullmatch(r"v?[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}", version):
                  record.update(event="observed", version=version)
              write_record("Workflow diagnostic: ", record)

          report("python", ".".join(str(n) for n in sys.version_info[:3]))
          PY
      - name: Verify published release and exact tagged source (no store credentials)
        run: python3 -B scripts/store_publish.py verify firefox
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          STORE_ASSETS: ${{ runner.temp }}/store-release
  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' && inputs.operation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firefox-release
    permissions:
      contents: read
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Report installed runtimes
        run: |
          python3 - <<'PY'
          import re, sys
          from scripts.workflow_diagnostics import write_record

          def report(tool, version):
              record = {"component": "workflow-runtime", "stage": "runtime", "event": "unavailable", "tool": tool}
              if isinstance(version, str) and re.fullmatch(r"v?[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}", version):
                  record.update(event="observed", version=version)
              write_record("Workflow diagnostic: ", record)

          report("python", ".".join(str(n) for n in sys.version_info[:3]))
          PY
      - name: Reverify release immediately before authentication
        run: python3 -B scripts/store_publish.py verify firefox
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          STORE_ASSETS: ${{ runner.temp }}/store-release
      - name: Upload verified package and read back store state
        run: python3 -B scripts/store_publish.py publish firefox
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          STORE_ASSETS: ${{ runner.temp }}/store-release
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
